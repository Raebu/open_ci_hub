name: open-ci-hub
services:
  github:
    profiles: [github]
    build:
      context: .
      dockerfile: containers/github/Dockerfile
    container_name: open-ci-github-runner
    working_dir: /home/runner
    command: ["./run.sh"]
    restart: "no"
    volumes:
      - github-runner-state:/home/runner
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 2g
    cpus: 1.5
    memswap_limit: 2g

  gitlab:
    profiles: [gitlab]
    build:
      context: .
      dockerfile: containers/gitlab/Dockerfile
    container_name: open-ci-gitlab-runner
    restart: "no"
    volumes:
      - gitlab-runner-config:/etc/gitlab-runner
      - gitlab-runner-builds:/home/gitlab-runner
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 2g
    cpus: 1.5
    memswap_limit: 2g

  circleci:
    profiles: [circleci]
    image: circleci/runner-agent:machine-3
    container_name: open-ci-circleci-runner
    restart: "no"
    env_file:
      - .local/circleci.env
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 2g
    cpus: 1.5
    memswap_limit: 2g

volumes:
  github-runner-state:
  gitlab-runner-config:
  gitlab-runner-builds:
