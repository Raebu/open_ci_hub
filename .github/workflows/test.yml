# Avoid paid hosted runner minutes on private repositories. This only runs on
# a trusted self-hosted runner after an operator manually dispatches it.
name: Open CI Hub tests (self-hosted)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: [self-hosted, linux, local-ci]
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Run Python test suite
        run: python3 -m unittest discover -s tests -v
