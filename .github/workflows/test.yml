# Development test harness for local act only. Automatic CI is owned by Open CI Hub.
# GitHub Actions must not run builds/tests on push or pull_request.
name: Open CI Hub local act test harness
on:
  workflow_dispatch:

concurrency:
  group: open-ci-hub-local-tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: [self-hosted, linux, local-ci]
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Explain why this run is inert on GitHub Actions
        if: ${{ env.ACT != 'true' }}
        run: echo "No CI executed by GitHub Actions. Use the Open CI Hub local execution bridge; ACT=true is reserved for local act."
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: ${{ env.ACT == 'true' }}
      - name: Record full Python test execution locally
        if: ${{ env.ACT == 'true' }}
        run: python3 execution_evidence.py run --name python-unittest --output .local/ci-proof/receipt.json --timeout 540 -- python3 -m unittest discover -s tests -v
      - name: Show sanitised failure details
        if: ${{ always() && env.ACT == 'true' && failure() }}
        run: |
          if test -f .local/ci-proof/python-unittest.log; then
            tail -n 160 .local/ci-proof/python-unittest.log
          else
            echo 'No unittest transcript was produced'
          fi
      - name: Verify receipt matches actual execution transcript
        if: ${{ always() && env.ACT == 'true' }}
        run: python3 execution_evidence.py verify .local/ci-proof/receipt.json
      - name: Upload self-hosted execution proof (not independent attestation)
        if: ${{ always() && env.ACT == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: open-ci-hub-execution-proof
          path: |
            .local/ci-proof/receipt.json
            .local/ci-proof/python-unittest.log
          if-no-files-found: error
          retention-days: 7
